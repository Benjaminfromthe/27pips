services:
  - type: web
    name: 27pips
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PIN
        value: 27pips2025
      - key: FLASK_DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: 27pips-db
          property: connectionString

databases:
  - name: 27pips-db
    plan: free
